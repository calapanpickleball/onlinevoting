<!doctype html><html lang="tl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CCPC Wrong Outfit, Wrong Paddle - Display</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css">
<style>html{font-size:1.05vw}body{overflow:hidden;padding:1.5rem 2.5rem;height:100vh}header{display:flex;align-items:center;gap:1.5rem;margin-bottom:1.2rem}header h1{font-size:2.6rem}section h2{font-size:2.4rem}
.grid{display:grid;gap:.9rem;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr))}.pc{padding:.7rem .8rem;display:flex;flex-direction:column;justify-content:center;text-align:center;box-shadow:3px 3px 0 var(--ink);overflow:hidden}.pc h3{font-size:1.95rem;overflow-wrap:anywhere;margin:.3rem 0 0}.num{font-family:Bungee;color:var(--pink);font-size:1.3rem;line-height:1}.pc:nth-child(3n){transform:rotate(-1.2deg)}.pc:nth-child(3n+1){transform:rotate(.8deg)}
.mid{display:flex;gap:2rem;align-items:flex-start;justify-content:center;margin-top:1rem}.timer{font-size:7rem;line-height:1}.qr{width:24rem;height:24rem;background:#fff;border:.4rem solid var(--ink);border-radius:1rem;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Bungee;padding:.8rem}.qr img,.qr canvas{width:100%!important;height:100%!important;max-width:100%;max-height:100%}
.ct{text-align:center;font-size:1.6rem;font-weight:700}.aw{min-height:15rem}.aw h3{font-size:1.4rem}.aw ol{list-style:none;padding:0;margin:.5rem 0}.aw li{display:flex;gap:.6rem;align-items:center;font-size:1.05rem;padding:.25rem 0;border-bottom:2px dashed #ccc}.aw li b{font-family:Bungee;color:var(--pink);width:1.6rem}.aw li span{flex:1}.aw li em{font-style:normal;font-weight:700}.aw .q{font-family:Bungee;font-size:5rem;text-align:center;color:#ddd}.aw.on{background:#fff6c9;animation:pop .5s}@keyframes pop{from{transform:scale(.9) rotate(-2deg)}}
.rf3{display:flex;gap:2.5rem;justify-content:center;margin-top:.6rem}.wc{text-align:center}.wt{font-family:Bungee;font-size:1.5rem}.wheel{position:relative;width:19rem;height:19rem;margin:.6rem auto}.wh{width:100%;height:100%;border-radius:50%;border:.4rem solid var(--ink);box-shadow:5px 5px 0 var(--ink);background:#fff}.wh svg{width:100%;height:100%;display:block}.ptr{position:absolute;top:-1.4rem;left:50%;margin-left:-1rem;border:1rem solid transparent;border-top:2.2rem solid var(--ink);border-bottom:0;z-index:2}.slot{font-family:Bungee;font-size:2.2rem;height:3rem;color:var(--pink);text-shadow:2px 2px 0 var(--ink)}
#rs{font-family:Bungee;font-size:2.4rem;min-height:7rem;text-align:center;display:flex;flex-direction:column;justify-content:center}.wn{font-size:4.5rem;color:var(--pink);text-shadow:4px 4px 0 var(--ink);animation:pop .6s}#wl{list-style:none;padding:0;margin:.5rem 0 0;display:flex;gap:1rem;justify-content:center;font-size:1.4rem}#wl li{background:#fff;border:3px solid var(--ink);border-radius:.8rem;padding:.4rem .9rem;box-shadow:3px 3px 0 var(--ink)}#wl b{font-family:Bungee;color:var(--pink);margin-right:.5rem}
.how{font-size:1.15rem;line-height:1.45;text-align:left;margin-top:.8rem;width:24rem;background:#fff;border:3px solid var(--ink);border-radius:.8rem;padding:.7rem 1rem;box-shadow:3px 3px 0 var(--ink)}.how b{font-weight:700}.lnk{font-family:Bungee;font-size:1.35rem;margin-top:.8rem;width:24rem;background:var(--pink);color:#fff;border:3px solid var(--ink);border-radius:.8rem;padding:.6rem .8rem;box-shadow:3px 3px 0 var(--ink);word-break:break-all}
#t0{position:fixed;inset:0;z-index:5;background:#fff}#t0 img{display:block;width:100vw;height:100vh;object-fit:fill}
@media(prefers-reduced-motion:reduce){.aw.on{animation:none}}</style></head><body>
<header><span class="sticker" style="font-size:1.4rem">Oct 3, 2026</span><h1>CCPC Wrong Outfit, Wrong Paddle Open Play</h1></header>
<section id="t0" class="hide"><img src="backdrop.png" alt="Wrong Outfit, Wrong Paddle Open Play"></section>
<section id="t1"><h2>Mga Kalahok 🎉</h2><div id="cards" class="grid"></div></section>
<section id="t2" class="hide"><h2>Mag-register na para makaboto! 📲</h2><div class="mid"><div><div class="ct">1. Kumonek sa WiFi</div><div class="qr" id="q1"></div><div class="how" id="wi"></div></div>
<div style="text-align:center"><div class="big timer" id="rt">5:00</div><div class="ct"><span id="rc" style="font-size:3rem;color:var(--pink);font-family:Bungee">0</span> voters na ang naka-register</div></div>
<div><div class="ct">2. I-scan para bumoto</div><div class="qr" id="q2"></div><div class="lnk" id="vl"></div></div></div></section>
<section id="t3" class="hide"><h2>BOTOHAN NA! 🗳️</h2><div style="text-align:center;margin-top:1rem"><div class="big timer" id="vt">5:00</div><div class="ct" id="vc" style="margin:1rem 0"></div><div class="bar" style="max-width:60rem;margin:auto;height:2rem"><i id="pb"></i></div></div></section>
<section id="t4" class="hide"><h2>Results 🏆</h2><div id="aw" class="grid" style="grid-template-columns:repeat(4,1fr)"></div></section>
<section id="t5" class="hide"><h2>RAFFLE! 🎟️ Premyo: Open Play Voucher</h2><div class="rf3"><div class="wc"><div class="wt">1 · Adjective</div><div class="wheel"><div class="wh" id="w0"></div><div class="ptr"></div></div><div class="slot" id="s0">?</div></div><div class="wc"><div class="wt">2 · Color</div><div class="wheel"><div class="wh" id="w1"></div><div class="ptr"></div></div><div class="slot" id="s1">?</div></div><div class="wc"><div class="wt">3 · Noun</div><div class="wheel"><div class="wh" id="w2"></div><div class="ptr"></div></div><div class="slot" id="s2">?</div></div></div><div id="rs"></div><ol id="wl"></ol></section>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script src="common.js"></script><script src="sounds.js"></script>
<button id="se" class="alt" style="position:fixed;right:1rem;bottom:1rem;z-index:9;font-size:1.2rem">🔊 Enable sound</button>
<script>
const DEF={ssid:'CCPCxPKLBOX',pass:'pickleball1',url:'https://www.vote.calapancitypickleball.club'};
let S={},P={},N={},V={},R={},lq=null,lwf=null,lw=null,deg=0,hold={},ls=null,le=null,lcd=null,sawRev=null,susp=0,lid=null,lk=null,lstop=null,rot=[0,0,0];const L=new Set(),pr={ready:false,ph:null,n:0,v:0,rv:{},w:0};
$('#se').onclick=()=>{SFX.enable();$('#se').remove();SFX.play('voter-join')};
const WL=[WORDS.a,WORDS.c,WORDS.n],KEY=['a','c','n'],PAL=['#ff2e88','#16c7b0','#6a3df0','#ffd23d'],CC={Blue:'#2f6bff',Pink:'#ff7eb6',Red:'#e8242c',Green:'#1fb84a',Orange:'#ff8a1f'};
function mkWheel(l,k){const r=100,n=l.length;let h='<svg viewBox="-110 -110 220 220">';
l.forEach((w,i)=>{const a0=i*2*Math.PI/n-Math.PI/2,a1=(i+1)*2*Math.PI/n-Math.PI/2,am=(a0+a1)/2;
h+=`<path d="M0 0L${r*Math.cos(a0)} ${r*Math.sin(a0)}A${r} ${r} 0 0 1 ${r*Math.cos(a1)} ${r*Math.sin(a1)}Z" fill="${k===1?CC[w]:PAL[i%4]}" stroke="#1b1147" stroke-width="2"/>`;
h+=`<text transform="rotate(${am*180/Math.PI}) translate(${r*.6} 0)" text-anchor="middle" dominant-baseline="middle" font-size="12" font-family="Bungee,sans-serif" style="fill:#fff;stroke:#1b1147;stroke-width:3px;paint-order:stroke">${w}</text>`});return h+'</svg>'}
WL.forEach((l,k)=>$('#w'+k).innerHTML=mkWheel(l,k));
function resetW(){rot=[0,0,0];[0,1,2].forEach(k=>{const e=$('#w'+k);e.style.transition='none';e.style.transform='rotate(0deg)';void e.offsetWidth})}
function land(k,w,anim){const l=WL[k],seg=360/l.length,idx=Math.max(0,l.indexOf(w)),j=(Math.random()-.5)*seg*.5,e=$('#w'+k);
const need=((360-(idx+.5)*seg+j)-(rot[k]%360)+720)%360;rot[k]+=(anim?360*5:0)+need;void e.offsetWidth;
e.style.transition=anim?'transform 6s cubic-bezier(.15,.7,.15,1)':'none';e.style.transform='rotate('+rot[k]+'deg)'}
function snap(){pr.ph=S.phase;pr.n=Object.keys(N).length;pr.v=Object.keys(V).length;pr.rv={...(S.reveal||{})};pr.w=Object.keys(R.winners||{}).length}
ready.then(()=>{[['state',x=>S=x||{}],['participants',x=>P=x||{}],['nicknames',x=>N=x||{}],['votes',x=>V=x||{}],['raffle',x=>R=x||{}]].forEach(([p,f])=>listen(p,x=>{f(x);L.add(p);draw()}));setInterval(tick,250)});
function draw(){const tab=S.tab??1;SFX.setVol(((S.sound||{}).vol??80)/100);SFX.setMute(!!(S.sound||{}).mute);
if(L.size>=5){if(!pr.ready)pr.ready=true;else{if(S.phase!==pr.ph){const m={registration:'reg-start',voting:'voting-start',closed:'voting-closed'}[S.phase];if(m)SFX.play(m)}
const n0=Object.keys(N).length,v0=Object.keys(V).length;if(n0>pr.n)SFX.play('voter-join');if(v0>pr.v)SFX.play('vote-cast');
Object.keys(S.reveal||{}).forEach(k=>{if(!pr.rv[k]){hold[k]=Date.now()+2200;SFX.play('award-drumroll');setTimeout(()=>{SFX.play('award-reveal');draw()},2200)}});
if(Object.keys(R.winners||{}).length<pr.w&&!R.current)SFX.play('raffle-redraw')}snap()}
SFX.stop('bg-lobby');if(tab===3&&S.phase==='voting')SFX.loop('bg-voting');else SFX.stop('bg-voting');[0,1,2,3,4,5].forEach(i=>$('#t'+i).classList.toggle('hide',i!==tab));
$('#cards').innerHTML=Object.values(P).sort((a,b)=>a.num-b.num).map(p=>`<div class="card pc"><div class="num">#${p.num}</div><h3>${esc(p.name)}</h3></div>`).join('');{const cn=Object.keys(P).length;$('#cards').style.gridTemplateColumns='repeat('+(cn<=24?6:cn<=35?7:8)+',1fr)'}
const n=Object.keys(N).length,v=Object.keys(V).length,pc=n?Math.round(v/n*100):0;$('#rc').textContent=n;$('#vc').textContent=`${v} sa ${n} registered voters ang nakaboto na (${pc}%)`;$('#pb').style.width=pc+'%';
const st=S.settings||{},url=st.voteUrl||DEF.url,ssid=st.ssid||DEF.ssid,pw=st.pass||DEF.pass,disp=url.replace(/^https?:\/\//,'').replace(/\/$/,'');
if(url!==lq){lq=url;$('#q2').innerHTML='';new QRCode($('#q2'),{text:url,width:400,height:400})}
const wq='WIFI:T:WPA;S:'+ssid.replace(/([\\;,:"])/g,'\\$1')+';P:'+pw.replace(/([\\;,:"])/g,'\\$1')+';;',wk=st.wifiImg?'img'+st.wifiImg.length:wq;
if(wk!==lwf){lwf=wk;$('#q1').innerHTML='';if(st.wifiImg)$('#q1').innerHTML=`<img src="${st.wifiImg}">`;else new QRCode($('#q1'),{text:wq,width:400,height:400})}
$('#wi').innerHTML=`<b>Hindi ma-scan? Mag-connect manually:</b><br>1. Buksan ang WiFi settings ng phone<br>2. Piliin ang <b>${esc(ssid)}</b><br>3. Password: <b>${esc(pw)}</b><br>4. Buksan ang browser at pumunta sa <b>${esc(disp)}</b>`;$('#vl').textContent=disp;
$('#aw').innerHTML=CATS.map(c=>{const on=(S.reveal||{})[c.k]&&!(hold[c.k]>Date.now()),r=top5(V,c.k),pn=x=>P[x]?`#${x} ${esc(P[x].name)}`:'#'+x;
return `<div class="card aw ${on?'on':''}"><div style="font-size:2rem">${c.e}</div><h3>${c.t}</h3>${on?(r.length?`<ol>${r.map(x=>`<li><b>${x.r}</b><span>${pn(x.n)}</span><em>${x.t} ${x.t>1?'votes':'vote'}</em></li>`).join('')}</ol>`:'<p>Walang boto</p>'):'<div class="q">?</div>'}</div>`}).join('');const c=R.current;if(!c&&lid!==null){lid=null;lk=null;resetW()}
if(c){if(c.id!==lid){lid=c.id;lk=null;resetW();for(let j=0;j<c.step-1;j++)land(j,c.words[KEY[j]],false)}
const key=c.id+':'+c.step;if(key!==lk){lk=key;const k=c.step-1;if(now()-c.t<3000){land(k,c.words[KEY[k]],true);SFX.play('raffle-spin')}else land(k,c.words[KEY[k]],false)}}
$('#wl').innerHTML=[1,2,3].map(i=>{const w=(R.winners||{})[i];return `<li><b>#${i}</b><span>${w?esc(w.nick):'???'}</span></li>`}).join('');tick()}
function rtick(){const c=R.current,t=now();let h;
for(let j=0;j<3;j++){const show=c&&(j<c.step-1||(j===c.step-1&&t-c.t>=6000)),s=$('#s'+j),v=show?c.words[KEY[j]]:'?';if(s.textContent!==v)s.textContent=v}
const stopped=c&&t-c.t>=6000,wait=c&&stopped&&c.step<3;
if(wait&&!susp){susp=1;SFX.loop('raffle-suspense')}if(!wait&&susp){susp=0;SFX.stop('raffle-suspense')}
const k=c?c.id+':'+c.step:null;if(c&&stopped&&k!==lstop){lstop=k;if(t-c.t<9000)SFX.play(c.step===3?'raffle-winner':'wheel-stop')}
if(!c)h='Sino ang papalarin? 🎟️';else if(!stopped)h='Umiikot ang wheel #'+c.step+'... 🎡';else if(c.step<3)h='Sino kaya ang mapipili? 🥁';
else h=`<div class="wn">${c.words.a} ${c.words.c} ${c.words.n}</div><div style="font-size:2rem">Hoy! Ikaw ang nanalo! 🎉</div>`;
const e=$('#rs');if(e.dataset.h!==h){e.dataset.h=h;e.innerHTML=h}}
function tick(){rtick();const ph=S.phase||'idle',t=now();
if(ph==='registration'||ph==='voting'){const e=ph==='voting'?S.voteEnd:S.regEnd,rem=e-t,s=Math.ceil(rem/1000);if(rem>0&&s<=10&&s!==ls){ls=s;SFX.play('countdown-tick')}if(rem<=0&&rem>-2000&&le!==ph+e){le=ph+e;SFX.play('timer-end')}}
$('#rt').textContent=ph==='registration'?fmt(S.regEnd-t):ph==='idle'?fmt((S.regMin||5)*60000):'CLOSED';
$('#vt').textContent=ph==='voting'?fmt(S.voteEnd-t):(ph==='closed')?'CLOSED':fmt((S.voteMin||5)*60000)}
</script></body></html>
